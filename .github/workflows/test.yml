# Every push and pull request: the engine in dist/ matches its sources and model, and the suites pass (node, then the
# browser suites in the runner's Chrome; some of those time the page with the CPU slowed, so a busy runner can fail them).
name: test

on: [push, pull_request]

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tools the PDF and font suites check with
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qpdf poppler-utils
          pip install pillow pypdf fonttools
      - run: npm ci
      - name: Cache the data sets
        uses: actions/cache@v4
        with:
          path: training/scratch/data
          key: nib-data-${{ hashFiles('tools/fetch_data.py', 'training/parse_crohme.py', 'tools/training_to_jsonl.py', 'test/stress.js', 'test/compose.js', 'test/school_synth.jsonl', 'test/fixtures/training_*.json') }}
      - run: npm run data
      - name: dist/nib.js is what its sources and model build
        run: python3 build.py && git diff --exit-code dist/nib.js
      - run: npm test
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node-logs
          path: test/shots/logs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Cache the data sets
        uses: actions/cache@v4
        with:
          path: training/scratch/data
          key: nib-data-${{ hashFiles('tools/fetch_data.py', 'training/parse_crohme.py', 'tools/training_to_jsonl.py', 'test/stress.js', 'test/compose.js', 'test/school_synth.jsonl', 'test/fixtures/training_*.json') }}
      - run: npm run data
      - name: The browser suites, in the runner's Chrome
        run: CHROME="$(command -v google-chrome)" npm run test:browser
      - name: Keep the logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-logs
          path: test/shots
